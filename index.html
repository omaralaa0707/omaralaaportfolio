  <script>
    // Applies the stored/default theme before first paint to avoid a
    // flash of the wrong theme. Defaults to dark (the site's original
    // look) unless the visitor has explicitly toggled to light before.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
