<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omar Alaa — Web Designer & Developer</title>
  <meta name="description" content="Freelance web designer and developer based in Cairo, Egypt. I build websites for brands, clinics, and founders." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:  '#f0ede8',
            muted:    '#6b6b6b',
            surface:  '#0f0f0f',
            border:   '#1c1c1c',
            bg:       '#080808',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    * { cursor: none; }

    body {
      background-color: #080808;
      color: #f0ede8;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 8px; height: 8px;
      background: #f0ede8;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
      transition: width 0.2s, height 0.2s, background 0.2s;
    }
    .cursor.expanded {
      width: 40px; height: 40px;
      background: transparent;
      border: 1px solid rgba(240,237,232,0.4);
      margin-left: -16px; margin-top: -16px;
    }

    /* Nav scroll state */
    nav.scrolled {
      background: rgba(8,8,8,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1c1c1c;
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar { display: none; }

    /* Project card media */
    .card-media { aspect-ratio: 16/9; overflow: hidden; }
    .card-media video,
    .card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94); }
    .project-card:hover .card-media video,
    .project-card:hover .card-media img { transform: scale(1.03); }

    /* Arrow hover */
    .arrow-link { display: inline-flex; align-items: center; gap: 6px; transition: gap 0.3s; }
    .project-card:hover .arrow-link { gap: 12px; }

    /* Section divider */
    .section-divider { border-top: 1px solid #1c1c1c; }
  </style>
</head>
<body class="bg-bg text-primary font-sans">

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>

  <!-- NAVIGATION -->
  <nav id="nav" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 md:px-12 py-5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">

      <!-- Logo -->
      <a href="#" class="text-primary font-semibold text-base tracking-tight">Omar Alaa</a>

      <!-- Center links -->
      <div class="hidden md:flex items-center gap-8">
        <a href="#work"    class="text-muted hover:text-primary transition-colors text-sm tracking-wide">Work</a>
        <a href="#about"   class="text-muted hover:text-primary transition-colors text-sm tracking-wide">About</a>
        <a href="#contact" class="text-muted hover:text-primary transition-colors text-sm tracking-wide">Contact</a>
      </div>

      <!-- CTA -->
      <a href="#contact"
         class="hidden md:inline-flex items-center gap-2 border border-border text-primary text-sm px-5 py-2.5 rounded-full hover:bg-surface transition-colors duration-200 group">
        Get in touch
        <span class="transition-transform duration-300 group-hover:translate-x-1">→</span>
      </a>
    </div>
  </nav>
  <!-- HERO -->
<section id="hero" class="min-h-screen flex flex-col justify-end pb-16 md:pb-24 px-6 md:px-12 pt-32">
  <div class="max-w-7xl mx-auto w-full">

    <!-- Location pill -->
    <div class="flex items-center gap-2 mb-8 md:mb-12">
      <span class="inline-flex items-center gap-2 border border-border text-muted text-xs px-3 py-1.5 rounded-full tracking-wide">
        <span class="w-1.5 h-1.5 rounded-full bg-primary inline-block"></span>
        Cairo, Egypt · <span id="live-time" class="font-mono"></span>
      </span>
    </div>

    <!-- Headline -->
    <h1 id="hero-headline"
        class="text-[clamp(2.5rem,6vw,6rem)] font-semibold leading-[1.05] tracking-tight text-primary mb-8 md:mb-10 max-w-5xl">
      I design and build websites that people remember.
    </h1>

    <!-- Subtext + CTA row -->
    <div id="hero-sub" class="flex flex-col md:flex-row md:items-end gap-8 opacity-0">
      <p class="text-muted text-base md:text-lg max-w-xl leading-relaxed">
        Freelance web designer &amp; developer — I work with brands, clinics, and founders
        to turn ideas into production sites.
      </p>
      <div class="flex items-center gap-4 shrink-0">
        <a href="#contact"
           class="inline-flex items-center gap-2 bg-primary text-bg text-sm font-medium px-6 py-3 rounded-full hover:opacity-90 transition-opacity group">
          Get in touch
          <span class="transition-transform duration-300 group-hover:translate-x-1">→</span>
        </a>
      </div>
    </div>

    <!-- Tags row -->
    <div id="hero-tags" class="flex flex-wrap gap-3 mt-8 opacity-0">
      <span class="border border-border text-muted text-xs px-4 py-2 rounded-full tracking-widest uppercase">Web Design</span>
      <span class="border border-border text-muted text-xs px-4 py-2 rounded-full tracking-widest uppercase">Development</span>
      <span class="border border-border text-muted text-xs px-4 py-2 rounded-full tracking-widest uppercase">UI/UX</span>
    </div>

  </div>
</section>

<div class="section-divider mx-6 md:mx-12"></div>
  <!-- WORK placeholder -->
  <!-- ABOUT placeholder -->
  <!-- STATS placeholder -->
  <!-- CONTACT placeholder -->
  <!-- FOOTER placeholder -->

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Nav scroll behavior
    window.addEventListener('scroll', () => {
      const nav = document.getElementById('nav');
      nav.classList.toggle('scrolled', window.scrollY > 50);
    });

    // Live Cairo time
    function updateTime() {
      const t = new Date().toLocaleTimeString('en-US', {
        timeZone: 'Africa/Cairo',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      const el = document.getElementById('live-time');
      if (el) el.textContent = t;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // Hero word-by-word animation
    (function () {
      const headline = document.getElementById('hero-headline');
      const text = headline.textContent.trim();
      headline.innerHTML = text.split(' ').map(w => `<span class="inline-block">${w}</span>`).join(' ');

      const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

      tl.from('#hero-headline span', {
        opacity: 0,
        y: 24,
        stagger: 0.04,
        duration: 0.6,
        delay: 0.2,
      })
      .to('#hero-sub',  { opacity: 1, y: 0, duration: 0.5 }, '-=0.2')
      .to('#hero-tags', { opacity: 1, y: 0, duration: 0.4 }, '-=0.3');
    })();
  </script>
</body>
</html>
